    <script>
      function selectTheme(){
          const themeBtn = document.querySelector(".theme-button");
      
          let theme = "";
      
          if(localStorage.getItem("theme") !== null){
              theme = localStorage.getItem("theme");
          }else{
              localStorage.setItem("theme","white");
              theme = localStorage.getItem("theme");
          };
          if(document.querySelector(".fa-sun") !== null){
              document.querySelector(".fa-sun").remove();
          }if(document.querySelector(".fa-moon") !== null){
              document.querySelector(".fa-moon").remove();
          };
          if(theme === "dark"){
              document.querySelector("main").classList.add("dark");
              document.querySelectorAll(".tableRow").forEach(function(item){
                  item.style.color = "#fff";
              });
              document.querySelector(".title-text").style.color = "#fff";
              if(document.querySelector(".user-name") !== null && document.querySelector(".section-title") !== null){
                  document.querySelectorAll(".user-name").forEach(function(item){
                      item.style.color = "#fff";
                  });
                  document.querySelector(".section-title").style.color = "#fff";
              };
              if(document.querySelector(".modal-screen") !== null){
                  document.querySelector(".modal-screen").classList.add("dark");
                  document.querySelectorAll("input").forEach(function(item){
                      item.style.color = "#fff";
                  });
              };
              if(document.querySelector(".hero-card-data") !== null){
                  document.querySelectorAll(".hero-card-data").forEach(function(item){
                      item.style.color = "#fff";
                  });
              };
              if(document.querySelector(".section-title") !== null){
                  document.querySelector(".section-title").style.color = "#fff";
              };
              themeBtn.insertAdjacentHTML("beforeend",`
                  <i class="fas fa-moon" style="color:#fff;"></i>
              `);
              themeBtn.style.backgroundColor = "#000";
          }else{
              document.querySelector("main").classList.remove("dark");
              document.querySelectorAll(".tableRow").forEach(function(item){
                  item.style.color = "#000";
              });
              document.querySelector(".title-text").style.color = "#000";
              if(document.querySelector(".user-name") !== null && document.querySelector(".section-title") !== null){
                  document.querySelectorAll(".user-name").forEach(function(item){
                      item.style.color = "#000";
                  });
                  document.querySelector(".section-title").style.color = "#000";
              };
              if(document.querySelector(".modal-screen") !== null){
                  document.querySelector(".modal-screen").classList.remove("dark");
                  document.querySelectorAll("input").forEach(function(item){
                      item.style.color = "#000";
                  });
              };
              if(document.querySelector(".hero-card-data") !== null){
                  document.querySelectorAll(".hero-card-data").forEach(function(item){
                      item.style.color = "#000";
                  });
              };
              if(document.querySelector(".section-title") !== null){
                  document.querySelector(".section-title").style.color = "#000";
              };
              themeBtn.insertAdjacentHTML("beforeend",`
                  <i class="fas fa-sun"></i>
              `);
              themeBtn.style.backgroundColor = "#fff";
          };
        
          themeBtn.addEventListener("click",function(){
              if(theme === "dark"){
                  document.querySelector("main").classList.remove("dark");
                  document.querySelectorAll(".tableRow").forEach(function(item){
                      item.style.color = "#000";
                  });
                  document.querySelector(".title-text").style.color = "#000";
                
                
                  if(document.querySelector(".user-name") !== null && document.querySelector(".section-title") !== null){
                      document.querySelectorAll(".user-name").forEach(function(item){
                          item.style.color = "#000";
                      });
                      document.querySelector(".section-title").style.color = "#000";
                  };
                  if(document.querySelector(".modal-screen") !== null){
                      document.querySelector(".modal-screen").classList.remove("dark");
                      document.querySelectorAll("input").forEach(function(item){
                          item.style.color = "#000";
                      });
                  };
                  if(document.querySelector(".hero-card-data") !== null){
                      document.querySelectorAll(".hero-card-data").forEach(function(item){
                          item.style.color = "#000";
                      });
                  };
                  if(document.querySelector(".section-title") !== null){
                      document.querySelector(".section-title").style.color = "#000";
                  };
                
                  if(document.querySelector(".fa-sun") !== null){
                      document.querySelector(".fa-sun").remove();
                  }if(document.querySelector(".fa-moon") !== null){
                      document.querySelector(".fa-moon").remove();
                  };
                  
                  themeBtn.insertAdjacentHTML("beforeend",`
                      <i class="fas fa-sun"></i>
                  `);
                  themeBtn.style.backgroundColor = "#fff";
                
                  theme = "white";
                  localStorage.setItem("theme","white");
              }else{
                  document.querySelector("main").classList.add("dark");
                  document.querySelectorAll(".tableRow").forEach(function(item){
                      item.style.color = "#fff";
                  });
                  document.querySelector(".title-text").style.color = "#fff";
                
                  if(document.querySelector(".user-name") !== null && document.querySelector(".section-title") !== null){
                      document.querySelectorAll(".user-name").forEach(function(item){
                          item.style.color = "#fff";
                      });
                      document.querySelector(".section-title").style.color = "#fff";
                  };
                  if(document.querySelector(".modal-screen") !== null){
                      document.querySelector(".modal-screen").classList.add("dark");
                      document.querySelectorAll("input").forEach(function(item){
                          item.style.color = "#fff";
                      });
                  };
                  if(document.querySelector(".hero-card-data") !== null){
                      document.querySelectorAll(".hero-card-data").forEach(function(item){
                          item.style.color = "#fff";
                      });
                  };
                  if(document.querySelector(".section-title") !== null){
                      document.querySelector(".section-title").style.color = "#fff";
                  };
                
                  if(document.querySelector(".fa-sun") !== null){
                      document.querySelector(".fa-sun").remove();
                  }if(document.querySelector(".fa-moon") !== null){
                      document.querySelector(".fa-moon").remove();
                  };
                  themeBtn.insertAdjacentHTML("beforeend",`
                      
                      <i class="fas fa-moon" style="color:#fff;"></i>
                  `);
                  themeBtn.style.backgroundColor = "#000";
                  theme = "dark";
                  localStorage.setItem("theme","dark");
              };
          });
      };
      
      selectTheme();
      
      function showToast(message){
          let param = String(message);
          document.body.insertAdjacentHTML("beforeend",`
              <div class="toast">
                <i class="ui-border top-0"></i>
                <span class="icon-card">
                  <span class="icon"></span>
                </span>
                <span class="toast-content">  </span>
                <div class="process-bar">
                  <div class="process"></div>
                </div>
              </div>
          `);
            
          switch(param){
              case "delete":
                  document.querySelector(".toast").classList.remove("success");
                  document.querySelector(".toast").classList.remove("failed");
                  document.querySelector(".toast").classList.add("failed");
                  document.querySelector(".toast-content").innerHTML = "محصول با موفقیت حذف شد";
                  break;
              case "edit":
                  document.querySelector(".toast").classList.remove("success");
                  document.querySelector(".toast").classList.remove("failed");
                  document.querySelector(".toast").classList.add("success");
                  document.querySelector(".toast-content").innerHTML = "محصول با موفقیت ویرایش شد";
                  break;
              case "create":
                  document.querySelector(".toast").classList.remove("success");
                  document.querySelector(".toast").classList.remove("failed");
                  document.querySelector(".toast").classList.add("success");
                  document.querySelector(".toast-content").innerHTML = "محصول با موفقیت اضافه شد";
                  break;
          }
        
          const processBar = document.querySelector(".process-bar");
          const process  = document.querySelector(".process");
          let processWidth = 0;
          let timeProcessing = setInterval(function(){
              process.style.width = `${processWidth}%`;
              processWidth++;
          },1);
        
        
        
          setTimeout(function(){
              process.style.width = `0%`;
              document.querySelector(".toast").remove();
              clearInterval(timeProcessing);
              processWidth = 0;   
          },2500);
      };
      
      const toggleSidebar = document.querySelector(".toggle-sidebar");
      const sidebar = document.querySelector(".sidebar");
      const createProduct = document.querySelector("#create-product");
      const modalScreen = document.querySelector(".modal-screen");
      const tableBody = document.querySelector(".table-body");
      
      toggleSidebar.addEventListener("click",function(){
          sidebar.classList.toggle("open");
      });
      
      let DB = {
          users:[
              // {id:0,firstName:"",lastName:"",userName:"",email:"",password:""},
      
          ],
          products:[
              // {id:0,proName:"",proPrice:0,proShortName:""},
      
          ]
      };
      
      // 123 -> ['1','2','3'] 
      
      function showPrice(price){
          let finalPrice = "";
          let priceArray = String(price).split('').reverse();
          for(let i = 0;i<priceArray.length;i++){
              if(i % 3 === 0 && i !== 0){
                  finalPrice += ',';
              };
              finalPrice += priceArray[i];
          };
          finalPrice = finalPrice.split('').reverse().join('');
          return finalPrice;
      };
      
      // show products function
      let clickedPageId = 1;
      function DOMProductsLoading(){
          //get data from local storage
          const productsData = document.querySelector(".products-data");
      
          const products = document.querySelectorAll(".tableRow");
          if(localStorage.getItem("DB") !== null){
              DB = JSON.parse(localStorage.getItem("DB"));
          };
          if(products !== undefined){
              products.forEach(function(item){
                  item.remove();
              });
          };
        
          // sync length of products
          productsData.innerHTML = DB.products.length;
        
        
          //loading products in DOM
        
          const pagination = document.querySelector(".pagination");
          const productsLength = DB.products.length;
          let prodouctPaginationLength =Math.ceil(productsLength/5);
        
          if(document.querySelector(".page") !== null){
              document.querySelectorAll(".page").forEach(function(item){
                  item.remove();
              });
          };
        
          for(let i = 0 ; i<prodouctPaginationLength ; i++){
              pagination.insertAdjacentHTML("beforeend",`
                  <span data-tab="${i+1}" class="page">${i+1}</span>
              `);
          };
        
          const pages = document.querySelectorAll(".page");
          if(pages.length){
              pages.forEach(function(page){
                  page.addEventListener("click",function(e){
                  
                      pages.forEach(function(p){
                          p.classList.remove("active");
                      });
                      page.classList.add("active");
                      selectedPage = +page.dataset.tab;
                      
                    
                    
                      let lastIndex = (+e.target.dataset.tab)*5 - 1;
                      let firstIndex = lastIndex-4;
                    
                      if(document.querySelector(".tableRow") !== undefined){
                          document.querySelectorAll(".tableRow").forEach(function(item){
                              item.remove();
                          });
                      };
                    
                      for(let i=firstIndex;i<=lastIndex;i++){
                          if(DB.products[i] !== undefined){
                          
                              tableBody.insertAdjacentHTML("beforeend",`
                                  <div class="tableRow">
                                      <p class="product-title">${DB.products[i].proName}</p>
                                      <p class="product-price">${showPrice(DB.products[i].proPrice)}</p>
                                      <p class="product-shortName">${DB.products[i].proShortName}</p>
                                      <div class="product-manage">
                                        <button class="edit-btn" data-id="${DB.products[i].id}">
                                          <i class="fas fa-edit" data-id="${DB.products[i].id}"></i>
                                        </button>
                                        <button class="remove-btn" data-id="${DB.products[i].id}">
                                          <i class="fas fa-trash-alt" data-id="${DB.products[i].id}"></i>
                                        </button>
                                      </div>
                                  </div>
                              `);
                          };
                      };
                    
                      selectTheme();
                      // edit btn
                      const editBtns = document.querySelectorAll(".edit-btn");
                      const removeBtns = document.querySelectorAll(".remove-btn");
                    
                      editBtns.forEach(function(item){
                          item.addEventListener("click",function(e){
                          
                              let proIndex = DB.products.findIndex(function(item){
                                  return item.id === +e.target.dataset.id;
                              });
                            
                              if(document.querySelector(".modal") !== null){
                                  document.querySelector(".modal").remove();
                              };
                              modalScreen.insertAdjacentHTML("beforeend",`
                                  <div class="modal">
                                    <header class="modal-header">
                                       <h3 style="color : gray">ویرایش محصول</h3>
                                      <button class="close-modal">
                                        <i class="fas fa-times"></i>
                                      </button>
                                    </header>
                                    <main class="modal-content">
                                      <input
                                        type="text"
                                        class="modal-input"
                                        placeholder="عنوان محصول را وارد نمائید ..."
                                        id="product-title"
                                        value = "${DB.products[proIndex].proName}"
                                      />
                                      <input
                                        type="number"
                                        class="modal-input"
                                        placeholder="قیمت محصول را وارد نمائید ..."
                                        id="product-price"
                                        value = "${DB.products[proIndex].proPrice}"
                                      />
                                      <input
                                        type="text"
                                        class="modal-input"
                                        placeholder="عنوان کوتاه محصول را وارد نمائید ..."
                                        id="product-shortName"
                                        value = "${DB.products[proIndex].proShortName}"
                                      />
                                    </main>
                                    <footer class="modal-footer">
                                      <button class="cancel">انصراف</button>
                                      <button class="submit">تائید</button>
                                    </footer>
                                  </div>
                              `);
                                
                              modalScreen.classList.remove("hidden");
                                
                              document.querySelector(".close-modal").addEventListener("click",function(){
                              modalScreen.classList.add("hidden");
                              });
                            
                              document.querySelector(".cancel").addEventListener("click",function(){
                                  modalScreen.classList.add("hidden");
                              });
                            
                              const productTitle = document.querySelector("#product-title");
                              const productPrice = document.querySelector("#product-price");
                              const productShortName = document.querySelector("#product-shortName");
                            
                              document.querySelector(".submit").addEventListener("click",function(){
                                  if(productTitle.value.length > 0 && productPrice.value.length > 0 && productShortName.value.length > 0){
                                  
                                      DB.products[proIndex].proName = productTitle.value;
                                      DB.products[proIndex].proPrice = +productPrice.value;
                                      DB.products[proIndex].proShortName = productShortName.value;
                                  
                                      dataSaving();
                                      DOMProductsLoading();
                                      showToast("edit");
                                  };
                                  modalScreen.classList.add("hidden");
                              });
                              selectTheme();
                          });
                      });
                    
                      // remove btn
                      removeBtns.forEach(function(item){
                          item.addEventListener("click",function(e){
                              if(document.querySelector(".modal") !== null){
                                  document.querySelector(".modal").remove();
                              };
                              modalScreen.insertAdjacentHTML("beforeend",`
                                  <div class="modal">
                                      <i class="ui-border top red"></i>
                                      <i class="ui-border bottom red"></i>
                                      <header class="modal-header">
                                        <h3 style="color : gray">حذف محصول</h3>
                                        <button class="close-modal">
                                          <i class="fas fa-times"></i>
                                        </button>
                                      </header>
                                      <main class="modal-content">
                                        <p class="remove-text">آیا از حذف این محصول اطمینان دارید؟</p>
                                      </main>
                                      <footer class="modal-footer">
                                        <button class="cancel">انصراف</button>
                                        <button class="submit">تائید</button>
                                      </footer>  
                                  </div>
                              `);
                              modalScreen.classList.remove("hidden");
                                
                              document.querySelector(".close-modal").addEventListener("click",function(){
                              modalScreen.classList.add("hidden");
                              });
                              document.querySelector(".cancel").addEventListener("click",function(){
                                  modalScreen.classList.add("hidden");
                              });
                            
                              document.querySelector(".submit").addEventListener("click",function(){
                                  DB.products = DB.products.filter(function(pro){
                                      return pro.id !== +e.target.dataset.id;
                                  });
                                  dataSaving();
                                  DOMProductsLoading();
                                  showToast("delete");
                                  modalScreen.classList.add("hidden");
                              });
                              selectTheme();
                          });
                      });
                      clickedPageId = +e.target.dataset.tab;
                  });
              });
              pages.forEach(function(item){
                  if(+item.dataset.tab === clickedPageId){
                      item.click();
                  };
              });
          };
      };
      
      function dataSaving(){
          localStorage.setItem("DB",JSON.stringify(DB));
      };
      
      DOMProductsLoading();
      
      if(createProduct !== null){
          createProduct.addEventListener("click",function(){
              if(document.querySelector(".modal") !== null){
                  document.querySelector(".modal").remove();
              };
              modalScreen.insertAdjacentHTML("beforeend",`
                  <div class="modal">
                    <header class="modal-header">
                      <h3 style="color : gray">ایجاد محصول</h3>
                      <button class="close-modal">
                        <i class="fas fa-times"></i>
                      </button>
                    </header>
                    <main class="modal-content">
                      <input
                        type="text"
                        class="modal-input"
                        placeholder="عنوان محصول را وارد نمائید ..."
                        id="product-title"
                      />
                      <input
                        type="number"
                        class="modal-input"
                        placeholder="قیمت محصول را وارد نمائید ..."
                        id="product-price"
                      />
                      <input
                        type="text"
                        class="modal-input"
                        placeholder="عنوان کوتاه محصول را وارد نمائید ..."
                        id="product-shortName"
                      />
                    </main>
                    <footer class="modal-footer">
                      <button class="cancel">انصراف</button>
                      <button class="submit">تائید</button>
                    </footer>
                  </div>
              `);
              modalScreen.classList.remove("hidden");
                
              document.querySelector(".close-modal").addEventListener("click",function(){
              modalScreen.classList.add("hidden");
              });
              document.querySelector(".cancel").addEventListener("click",function(){
                  modalScreen.classList.add("hidden");
              });
              DOMProductsLoading();
              const productTitle = document.querySelector("#product-title");
              const productPrice = document.querySelector("#product-price");
              const productShortName = document.querySelector("#product-shortName");
            
              document.querySelector(".submit").addEventListener("click",function(){
                  if(productTitle.value.length > 0 && productPrice.value.length > 0 && productShortName.value.length > 0){
                      if(localStorage.getItem("proID") === null){
                          localStorage.setItem("proID",1);
                      }else{
                          let proId = +localStorage.getItem("proID");
                          proId++;
                          localStorage.setItem("proID",String(proId));
                      };
                      DB.products.push({id:+localStorage.getItem("proID"),proName:productTitle.value,proPrice:+productPrice.value,proShortName:productShortName.value});
                    
                      dataSaving();
                      DOMProductsLoading();
                      selectTheme();
                      showToast("create");
                  };
                  modalScreen.classList.add("hidden");
              });
              selectTheme();
          });
      };
      
    </script>
  </body>
</html>
