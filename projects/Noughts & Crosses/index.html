<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noughts and Crosses</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <div class="box A1" style="border-left: none;border-top: none;"></div>
        <div class="box A2" style="border-top: none;"></div>
        <div class="box A3" style="border-top: none;border-right: none;"></div>
 
        <div class="box B1" style="border-left:none ;"></div>
        <div class="box B2" ></div>
        <div class="box B3" style="border-right: none;"></div>

        <div class="box C1" style="border-left: none;border-bottom: none;"></div>
        <div class="box C2" style="border-bottom: none;"></div>
        <div class="box C3" style="border-right: none;border-bottom: none;"></div>
    </div>
    <div class="player-container">
        <div class="circle-box">
            <img src="./image/circle-red .png">
        </div>
        <div class="cross-box">
            <img src="./image/cross-blue.png">
        </div>
    </div>

    <div class="win-card">
        <p></p>
        <button>Play</button>
    </div>
    <script src="./app.js"></script>
</body>
</html>
